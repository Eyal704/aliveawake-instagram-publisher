name: Send Reel review-ready alert

on:
  workflow_dispatch:
    inputs:
      reel_title:
        description: "Reel title or working title"
        required: true
        type: string
      video_url:
        description: "Stable public video review URL"
        required: true
        type: string
      thumbnail_url:
        description: "Stable public thumbnail URL"
        required: false
        default: ""
        type: string
      intended_slot:
        description: "Intended Vienna slot; this does not schedule the Reel"
        required: false
        default: "Not assigned"
        type: string
      caption:
        description: "Full approved social caption text, exactly as it will be posted"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: aliveawake-review-ready-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      REEL_TITLE: ${{ inputs.reel_title }}
      VIDEO_URL: ${{ inputs.video_url }}
      THUMBNAIL_URL: ${{ inputs.thumbnail_url }}
      INTENDED_SLOT: ${{ inputs.intended_slot }}
      CAPTION: ${{ inputs.caption }}
    steps:
      - name: Validate and send Telegram review notification
        run: |
          node <<'NODE'
          const {TELEGRAM_BOT_TOKEN: token, TELEGRAM_CHAT_ID: chatId, REEL_TITLE: title,
            VIDEO_URL: videoUrl, THUMBNAIL_URL: thumbnailUrl, INTENDED_SLOT: intendedSlot,
            CAPTION: caption} = process.env;

          if (!token || !chatId) throw new Error("Telegram repository secrets are not configured.");
          for (const [label, value] of [["video", videoUrl], ["thumbnail", thumbnailUrl]]) {
            if (!value) continue;
            const url = new URL(value);
            if (url.protocol !== "https:") throw new Error(`${label} URL must use HTTPS.`);
            const response = await fetch(url, {method: "HEAD", redirect: "follow"});
            if (!response.ok) throw new Error(`${label} URL returned HTTP ${response.status}.`);
          }

          // Telegram caps a single message at 4096 chars. Reserve room for the
          // surrounding lines/buttons; truncate the caption itself if it's ever
          // unusually long rather than letting the whole send fail.
          const MAX_CAPTION_CHARS = 3200;

          const lines = [
            "✅ Done! AliveAwake Reel ready for review",
            title,
            `Intended slot: ${intendedSlot} (not scheduled until approval)`,
          ];
          if (caption && caption.trim()) {
            const trimmed = caption.length > MAX_CAPTION_CHARS
              ? caption.slice(0, MAX_CAPTION_CHARS) + "\n… (truncated — full caption is in the review package)"
              : caption;
            lines.push("", "📝 Caption:", trimmed);
          }
          lines.push(
            "",
            "Watch the video, check the thumbnail, and read the caption above.",
            "Reply \"approve\" to schedule as-is, or reply with what to change to keep iterating."
          );
          const buttons = [[{text: "▶️ Watch video", url: videoUrl}]];
          if (thumbnailUrl) buttons.push([{text: "🖼 View thumbnail", url: thumbnailUrl}]);

          const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: "POST",
            headers: {"content-type": "application/json"},
            body: JSON.stringify({
              chat_id: chatId,
              text: lines.join("\n"),
              disable_web_page_preview: false,
              reply_markup: {inline_keyboard: buttons}
            })
          });
          if (!response.ok) throw new Error(`Telegram send failed with HTTP ${response.status}.`);
          const result = await response.json();
          if (!result.ok) throw new Error("Telegram did not confirm delivery.");
          console.log(`Telegram review notification delivered for ${title}.`);
          NODE
