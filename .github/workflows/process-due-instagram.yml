name: Process due Instagram queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aliveawake-due-instagram
  cancel-in-progress: false

jobs:
  publish-due:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GitHub Actions sets CI=true by default, and the Composio CLI silently
      # redacts every "id"-shaped field to the literal string "<REDACTED>"
      # whenever it sees CI=true (a log-hygiene feature, not a bug) — which
      # breaks every ID-based match against its output. Override it here so
      # this workflow gets real IDs back, the same as an interactive session.
      CI: "false"
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO: /home/runner/.composio/composio
      IG_ACCOUNT: aliveawake-main
      IG_USER_ID: "28033607902927427"
      ALIVEAWAKE_QUEUE_JSON: ${{ secrets.ALIVEAWAKE_QUEUE_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install and authenticate Composio CLI
        run: |
          for attempt in 1 2 3; do
            curl -fsSL https://composio.dev/install | COMPOSIO_INSTALL_SHELL=none sh && break
            echo "Install attempt $attempt failed (likely a transient network blip); retrying..."
            sleep 10
          done
          test -x "$COMPOSIO"
          "$COMPOSIO" login --user-api-key "$COMPOSIO_API_KEY" -y --no-skill-install

      - name: Process due Instagram posts and save (retried on concurrent-writer conflicts)
        id: process
        run: |
          git config user.name "aliveawake-publishing-bot"
          git config user.email "actions@users.noreply.github.com"
          process_failed=0
          for attempt in 1 2 3 4 5; do
            node scripts/process-due-instagram.mjs || process_failed=1
            if git diff --quiet -- docs/schedule.json; then
              break
            fi
            git add docs/schedule.json
            git commit -m "Update Instagram cloud queue"
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            echo "Push attempt $attempt hit a concurrent writer (another workflow or session updating the same file); resetting to latest and retrying with a fresh check..."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            if [ "$attempt" = "5" ]; then
              echo "Failed to save queue state after 5 attempts."
              exit 1
            fi
            sleep $((5 + RANDOM % 10))
          done
          if [ "$process_failed" = "1" ]; then
            exit 1
          fi
