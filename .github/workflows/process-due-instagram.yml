name: Process due Instagram queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aliveawake-due-instagram
  cancel-in-progress: false

jobs:
  publish-due:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO: /home/runner/.composio/composio
      IG_ACCOUNT: aliveawake-main
      IG_USER_ID: "28033607902927427"
      ALIVEAWAKE_QUEUE_JSON: ${{ secrets.ALIVEAWAKE_QUEUE_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install and authenticate Composio CLI
        run: |
          for attempt in 1 2 3; do
            curl -fsSL https://composio.dev/install | COMPOSIO_INSTALL_SHELL=none sh && break
            echo "Install attempt $attempt failed (likely a transient network blip); retrying..."
            sleep 10
          done
          test -x "$COMPOSIO"
          "$COMPOSIO" login --user-api-key "$COMPOSIO_API_KEY" -y --no-skill-install

      - name: Prepare or publish due Instagram posts
        id: process
        continue-on-error: true
        run: node scripts/process-due-instagram.mjs

      - name: Save queue state
        if: always()
        run: |
          if git diff --quiet -- docs/schedule.json; then
            exit 0
          fi
          git config user.name "aliveawake-publishing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/schedule.json
          git commit -m "Update Instagram cloud queue"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail when queue processing failed
        if: steps.process.outcome == 'failure'
        run: exit 1
