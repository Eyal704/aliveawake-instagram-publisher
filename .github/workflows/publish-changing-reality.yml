name: Publish Changing Reality (Instagram, one-off)

# Self-contained, single-post Instagram scheduler. Its dedicated secret keeps
# this post isolated from every other queued Reel. Facebook is already scheduled
# natively; the exact Facebook object is verified before Instagram publishes.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: publish-changing-reality
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CI: "false"
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO: /home/runner/.composio/composio
      IG_ACCOUNT: aliveawake-main
      IG_USER_ID: "28033607902927427"
      FB_ACCOUNT: facebook_urushi-influx
      FB_PAGE_ID: "299121263767927"
      QUEUE_JSON: ${{ secrets.CHANGING_REALITY_QUEUE }}
      PUBLISH_AT_EPOCH: "1787990400"
      FACEBOOK_VIDEO_ID: "2278037603034258"
      FACEBOOK_SCHEDULED_POST_ID: "299121263767927_1355734316640769"
    steps:
      - name: Stop once already published or before the six-hour window
        id: gate
        run: |
          if [ -z "$QUEUE_JSON" ]; then
            echo "Dedicated queue secret is absent; nothing to do."
            echo "done=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date +%s)
          if [ "$now" -lt $((PUBLISH_AT_EPOCH - 21600)) ]; then
            echo "More than six hours before due time; nothing to do yet."
            echo "done=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "done=false" >> "$GITHUB_OUTPUT"

      - name: Install Composio CLI
        if: steps.gate.outputs.done != 'true'
        run: |
          for attempt in 1 2 3; do
            curl -fsSL https://composio.dev/install | COMPOSIO_INSTALL_SHELL=none sh && break
            echo "Install attempt $attempt failed; retrying..."
            sleep 10
          done
          test -x "$COMPOSIO"

      - name: Authenticate Composio CLI
        if: steps.gate.outputs.done != 'true'
        run: "$COMPOSIO login --user-api-key \"$COMPOSIO_API_KEY\" -y --no-skill-install"

      - name: Create Instagram container
        if: steps.gate.outputs.done != 'true'
        id: container
        run: |
          video_url=$(jq -r '.videoUrl' <<<"$QUEUE_JSON")
          cover_url=$(jq -r '.coverUrl' <<<"$QUEUE_JSON")
          caption=$(jq -r '.caption' <<<"$QUEUE_JSON")
          created=$("$COMPOSIO" execute INSTAGRAM_POST_IG_USER_MEDIA \
            --account "$IG_ACCOUNT" \
            -d "$(jq -n --arg u "$IG_USER_ID" --arg v "$video_url" --arg c "$cover_url" --arg cap "$caption" \
              '{ig_user_id:$u, video_url:$v, cover_url:$c, caption:$cap, media_type:"REELS", share_to_feed:true}')")
          container_id=$(jq -r '.data.id // empty' <<<"$created")
          if [ -z "$container_id" ]; then
            echo "Failed to create Instagram container:"; echo "$created"; exit 1
          fi
          echo "container_id=$container_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Instagram container processing
        if: steps.gate.outputs.done != 'true'
        run: |
          for i in $(seq 1 40); do
            result=$("$COMPOSIO" execute INSTAGRAM_GET_POST_STATUS --account "$IG_ACCOUNT" \
              -d "{\"creation_id\":\"${{ steps.container.outputs.container_id }}\"}")
            status=$(jq -r '.data.status_code // empty' <<<"$result")
            if [ "$status" = "FINISHED" ]; then echo "Container ready."; exit 0; fi
            echo "Container status: $status, waiting..."
            sleep 15
          done
          echo "Container never reached FINISHED."; exit 1

      - name: Wait for Facebook preflight
        if: steps.gate.outputs.done != 'true'
        run: |
          preflight_at=$((PUBLISH_AT_EPOCH - 600))
          now=$(date +%s)
          if [ "$preflight_at" -gt "$now" ]; then sleep $((preflight_at - now)); fi

      - name: Verify exact Facebook scheduled object
        if: steps.gate.outputs.done != 'true'
        run: |
          result=$("$COMPOSIO" execute FACEBOOK_GET_SCHEDULED_POSTS --account "$FB_ACCOUNT" \
            -d "{\"page_id\":\"$FB_PAGE_ID\",\"limit\":100,\"fields\":\"id,scheduled_publish_time,is_published\"}")
          matches=$(jq --arg id "$FACEBOOK_SCHEDULED_POST_ID" --argjson epoch "$PUBLISH_AT_EPOCH" \
            '[.data.data[]? | select(.id == $id and .scheduled_publish_time == $epoch and .is_published == false)] | length' <<<"$result")
          if [ "$matches" -ne 1 ]; then
            echo "Exact Facebook object is not scheduled for the expected epoch."; exit 1
          fi

      - name: Wait until the exact Instagram publish time
        if: steps.gate.outputs.done != 'true'
        run: |
          now=$(date +%s)
          if [ "$PUBLISH_AT_EPOCH" -gt "$now" ]; then sleep $((PUBLISH_AT_EPOCH - now)); fi

      - name: Stop if a duplicate Instagram Reel already exists
        if: steps.gate.outputs.done != 'true'
        id: duplicate
        run: |
          caption=$(jq -r '.caption' <<<"$QUEUE_JSON")
          prefix=$(echo "$caption" | head -c 40 | tr '[:upper:]' '[:lower:]')
          since=$((PUBLISH_AT_EPOCH - 21600))
          result=$("$COMPOSIO" execute INSTAGRAM_GET_IG_USER_MEDIA --account "$IG_ACCOUNT" \
            -d "{\"ig_user_id\":\"$IG_USER_ID\",\"since\":$since,\"limit\":50,\"fields\":\"id,caption,permalink,timestamp\"}")
          matches=$(jq --arg p "$prefix" '[.data.data[]? | select(((.caption // "") | ascii_downcase) | startswith($p))] | length' <<<"$result")
          if [ "$matches" -gt 0 ]; then echo "duplicate=true" >> "$GITHUB_OUTPUT"; else echo "duplicate=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish Instagram Reel
        if: steps.gate.outputs.done != 'true' && steps.duplicate.outputs.duplicate != 'true'
        run: |
          result=$("$COMPOSIO" execute INSTAGRAM_POST_IG_USER_MEDIA_PUBLISH --account "$IG_ACCOUNT" \
            -d "{\"ig_user_id\":\"$IG_USER_ID\",\"creation_id\":\"${{ steps.container.outputs.container_id }}\",\"max_wait_seconds\":300,\"poll_interval_seconds\":5}")
          media_id=$(jq -r '.data.id // empty' <<<"$result")
          if [ -z "$media_id" ]; then echo "Publish failed:"; echo "$result"; exit 1; fi
          echo "Published media $media_id"

      - name: Verify Instagram Reel live
        if: steps.gate.outputs.done != 'true' && steps.duplicate.outputs.duplicate != 'true'
        run: |
          result=$("$COMPOSIO" execute INSTAGRAM_GET_IG_USER_MEDIA --account "$IG_ACCOUNT" \
            -d "{\"ig_user_id\":\"$IG_USER_ID\",\"since\":$((PUBLISH_AT_EPOCH - 600)),\"limit\":10,\"fields\":\"id,caption,permalink,username\"}")
          permalink=$(jq -r '.data.data[0].permalink // empty' <<<"$result")
          test -n "$permalink"
          echo "Verified: $permalink"
