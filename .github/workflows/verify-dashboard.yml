name: Verify AliveAwake publishing dashboard

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aliveawake-dashboard-verifier
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO: /home/runner/.composio/composio
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_ACCOUNT: aliveawake-main
      IG_USER_ID: "28033607902927427"
      FB_ACCOUNT: facebook_urushi-influx
      FB_PAGE_ID: "299121263767927"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Composio CLI
        run: |
          for attempt in 1 2 3; do
            curl -fsSL https://composio.dev/install | COMPOSIO_INSTALL_SHELL=none sh && break
            echo "Install attempt $attempt failed (likely a transient network blip); retrying..."
            sleep 10
          done
          test -x "$COMPOSIO"

      - name: Authenticate Composio CLI
        run: |
          "$COMPOSIO" login --user-api-key "$COMPOSIO_API_KEY" -y --no-skill-install
          "$COMPOSIO" whoami
          echo "[DEBUG] connections:"
          "$COMPOSIO" connections list
          echo "[DEBUG] direct page-details check for the target video's page:"
          "$COMPOSIO" execute FACEBOOK_GET_PAGE_DETAILS --account "$FB_ACCOUNT" -d "{\"page_id\":\"$FB_PAGE_ID\",\"fields\":\"id,name\"}" || true

      - name: Verify, alert, and save (retried on concurrent-writer conflicts)
        id: verify
        run: |
          git config user.name "aliveawake-publishing-bot"
          git config user.email "actions@users.noreply.github.com"
          verify_failed=0
          for attempt in 1 2 3 4 5; do
            node scripts/verify-dashboard.mjs || verify_failed=1
            node scripts/notify-telegram.mjs
            if git diff --quiet -- docs/schedule.json; then
              echo "Dashboard state is unchanged."
              break
            fi
            git add docs/schedule.json
            git commit -m "Update verified publishing dashboard"
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            echo "Push attempt $attempt hit a concurrent writer (another workflow or session updating the same file); resetting to latest and retrying with a fresh check..."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            if [ "$attempt" = "5" ]; then
              echo "Failed to save dashboard state after 5 attempts."
              exit 1
            fi
            sleep $((5 + RANDOM % 10))
          done
          if [ "$verify_failed" = "1" ]; then
            exit 1
          fi
