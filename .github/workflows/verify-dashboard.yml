name: Verify AliveAwake publishing dashboard

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aliveawake-dashboard-verifier
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO: /home/runner/.composio/composio
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_ACCOUNT: aliveawake-main
      IG_USER_ID: "28033607902927427"
      FB_ACCOUNT: facebook_urushi-influx
      FB_PAGE_ID: "299121263767927"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Composio CLI
        run: |
          for attempt in 1 2 3; do
            curl -fsSL https://composio.dev/install | COMPOSIO_INSTALL_SHELL=none sh && break
            echo "Install attempt $attempt failed (likely a transient network blip); retrying..."
            sleep 10
          done
          test -x "$COMPOSIO"

      - name: Authenticate Composio CLI
        run: |
          "$COMPOSIO" login --user-api-key "$COMPOSIO_API_KEY" -y --no-skill-install
          "$COMPOSIO" whoami

      - name: Verify expected posts against Instagram and Facebook
        id: verify
        continue-on-error: true
        run: node scripts/verify-dashboard.mjs

      - name: Send alerts for posts still unverified after 15 minutes
        if: always()
        run: node scripts/notify-telegram.mjs

      - name: Save verified dashboard state
        if: always()
        run: |
          if git diff --quiet -- docs/schedule.json; then
            echo "Dashboard state is unchanged."
            exit 0
          fi
          git config user.name "aliveawake-publishing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/schedule.json
          git commit -m "Update verified publishing dashboard"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail when platform verification failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
