name: Check publishing queue integrity

# Answers the question nobody could answer before: does every upcoming post
# actually have its private video/caption payload, or will it fail at publish
# time? The queue secrets are write-only, so only a workflow can read them.
#
# Read-only: never writes the secret, never publishes, never commits.
# Prints post ids and booleans only -- no secret values.

on:
  workflow_dispatch:
  schedule:
    # Twice a day, well ahead of the earliest 09:00 Vienna slot, so a missing
    # payload surfaces with hours to fix it rather than at the slot itself.
    - cron: "17 4 * * *"
    - cron: "17 16 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALIVEAWAKE_QUEUE_JSON: ${{ secrets.ALIVEAWAKE_QUEUE_JSON }}
      CREATOR_OF_SUFFERING_QUEUE: ${{ secrets.CREATOR_OF_SUFFERING_QUEUE }}
      STOP_BLAMING_QUEUE: ${{ secrets.STOP_BLAMING_QUEUE }}
      CHANGING_REALITY_QUEUE: ${{ secrets.CHANGING_REALITY_QUEUE }}
      EVERYONE_IS_YOUR_MIRROR_QUEUE: ${{ secrets.EVERYONE_IS_YOUR_MIRROR_QUEUE }}
      WAY_SHOWS_WHEN_YOU_WALK_QUEUE: ${{ secrets.WAY_SHOWS_WHEN_YOU_WALK_QUEUE }}
      STOP_BEING_A_COPY_QUEUE: ${{ secrets.STOP_BEING_A_COPY_QUEUE }}
      WHEN_YOU_ARE_YOU_QUEUE: ${{ secrets.WHEN_YOU_ARE_YOU_QUEUE }}
      SMALLEST_ACTIONS_SHAPE_LIFE_QUEUE: ${{ secrets.SMALLEST_ACTIONS_SHAPE_LIFE_QUEUE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compare private queue against public schedule
        run: node scripts/check-queue-integrity.mjs
