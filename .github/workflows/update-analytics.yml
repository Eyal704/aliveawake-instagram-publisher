name: Update AliveAwake analytics dashboard

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aliveawake-analytics-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # GitHub Actions sets CI=true by default, and the Composio CLI silently
      # redacts every "id"-shaped field to the literal string "<REDACTED>"
      # whenever it sees CI=true (a log-hygiene feature, not a bug) — which
      # breaks every ID-based match against its output. Override it here so
      # this workflow gets real IDs back, the same as an interactive session.
      CI: "false"
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO: /home/runner/.composio/composio
      IG_ACCOUNT: aliveawake-main
      IG_USER_ID: "28033607902927427"
      FB_ACCOUNT: facebook_urushi-influx
      FB_PAGE_ID: "299121263767927"
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Composio CLI
        run: curl -fsSL https://composio.dev/install | COMPOSIO_INSTALL_SHELL=none sh

      - name: Authenticate Composio CLI
        run: |
          "$COMPOSIO" login --user-api-key "$COMPOSIO_API_KEY" -y --no-skill-install
          "$COMPOSIO" whoami

      - name: Fetch Instagram and Facebook analytics
        id: analytics
        run: node scripts/update-analytics.mjs

      - name: Alert when analytics safety checks fail
        if: failure() && steps.analytics.outcome == 'failure'
        continue-on-error: true
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram is not configured; the failed workflow remains the loud guardrail."
            exit 0
          fi
          message="⚠️ AliveAwake analytics refresh failed. A platform call failed or returned an impossible zero-media result; prior verified data was preserved. Check the Update AliveAwake analytics dashboard workflow."
          payload=$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$message" \
            '{chat_id:$chat_id,text:$text,disable_web_page_preview:true}')
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "content-type: application/json" -d "$payload" >/dev/null

      - name: Save updated analytics
        run: |
          git config user.name "aliveawake-publishing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/analytics.json docs/analytics-history.json
          if git diff --cached --quiet; then
            echo "Analytics data is unchanged."
            exit 0
          fi
          git commit -m "Update analytics dashboard data"
          git pull --rebase origin main
          git push origin HEAD:main
